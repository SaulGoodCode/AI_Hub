name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0) - leave empty to use current package.json version'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync version from tag (push)
        if: github.event_name == 'push'
        run: node scripts/sync-version.js
        env:
          AIHUB_TAG: ${{ github.ref_name }}

      - name: Sync version from input (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: node scripts/sync-version.js
        env:
          AIHUB_TAG: ${{ inputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CI: true
          ELECTRON_NO_SANDBOX: 1
          ELECTRON_DISABLE_SANDBOX: 1
          # 强制在 CI 环境下不尝试签名
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          npm run dist:mac 2>&1

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CI: true
          ELECTRON_NO_SANDBOX: 1
          ELECTRON_DISABLE_SANDBOX: 1
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          npm run dist:win 2>&1

      - name: List dist artifacts
        if: always()
        shell: bash
        run: |
          echo "=== dist/ contents ==="
          ls -laR dist/ 2>&1 || echo "no dist/ directory"
          echo "=== file sizes ==="
          find dist/ -type f 2>/dev/null -exec ls -lh {} \; || true

      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    steps:
      - name: Download Windows dist
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-latest
          path: dist-windows
      
      - name: Download macOS dist
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-latest
          path: dist-macos

      - name: Merge artifacts
        run: |
          mkdir -p dist
          cp -r dist-windows/. dist/ 2>/dev/null || echo "no windows dist"
          cp -r dist-macos/. dist/ 2>/dev/null || echo "no macos dist"
          echo "=== merged dist ==="
          ls -laR dist/

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: false
